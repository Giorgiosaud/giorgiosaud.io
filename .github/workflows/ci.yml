name: CI

# BPL's centralized setup/lint/test workflows are pnpm-only; this repo uses Bun,
# so CI runs here until those workflows support Bun.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Prerender secrets placeholder
        # Astro 7 validates required server secrets while prerendering inside workerd, which
        # only reads .dev.vars/.env (not the job env). Real values live in Worker secrets at
        # runtime; these placeholders only satisfy the build-time check and are not deployed.
        run: printf 'BETTER_AUTH_SECRET=prerender-placeholder\nTURNSTILE_SECRET_KEY=prerender-placeholder\n' > .dev.vars
      - name: Build
        # Same as `bun run build` minus notifyNewPosts (no push notifications from PRs);
        # the self-heal map is gitignored and must be generated before astro build
        run: bun scripts/generateSelfHealMap.ts && bunx astro build
        env:
          # Client vars are inlined at build time
          BETTER_AUTH_URL: https://giorgiosaud.io
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
