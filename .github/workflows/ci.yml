name: CI

# BPL's centralized setup/lint/test workflows are pnpm-only; this repo uses Bun,
# so CI runs here until those workflows support Bun.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Build
        run: bunx astro build
        env:
          # Client vars are inlined at build time
          BETTER_AUTH_URL: https://giorgiosaud.io
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
