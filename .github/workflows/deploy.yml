name: Deploy

# Builds on the runner and deploys to Cloudflare Workers (personal account).
# Client-side env vars (astro:env context 'client') are baked into the bundle here,
# so they must come from GitHub vars — Worker secrets only cover runtime/server vars.
#
# Deploys when a release is published (Release Drafter keeps the draft up to date on each
# merge to main), so merges can be batched and new-post push notifications go out on purpose.
# The checkout is the release tag. workflow_dispatch stays for manual/emergency deploys.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-24.04
    environment:
      name: Production
      url: https://giorgiosaud.io
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
        env:
          BETTER_AUTH_URL: https://giorgiosaud.io
          SITE_URL: https://giorgiosaud.io
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          # Astro 7 validates required server secrets while prerendering. Real values live in
          # Worker secrets at runtime; these placeholders only satisfy the build-time check.
          BETTER_AUTH_SECRET: prerender-placeholder
          TURNSTILE_SECRET_KEY: prerender-placeholder
          # Used by scripts/notifyNewPosts.ts to call the push broadcast endpoint
          NOTIFY_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
